name: Update Worlds calendar

on:
  schedule:
    # Hourly. The 18:05 UTC run is the one that reveals at 19:00 CET.
    - cron: "5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-calendar
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24.x"

      - name: Build calendar
        env:
          PANDASCORE_TOKEN: ${{ secrets.PANDASCORE_TOKEN }}
          CALENDAR_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/worlds.ics
          # Optional overrides, set under Settings → Secrets and variables → Actions → Variables
          BLOCK_UNTIL_DATE: ${{ vars.BLOCK_UNTIL_DATE || '2026-11-02' }}
          LATE_FINISH_HOUR: ${{ vars.LATE_FINISH_HOUR || '23' }}
          REVEAL_HOUR: ${{ vars.REVEAL_HOUR || '19' }}
        run: npm run build

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add docs state
          git diff --staged --quiet || git commit -m "Update Worlds calendar"
          git push
